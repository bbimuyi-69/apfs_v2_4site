<div class="dashboard-v2">

  <!-- Top bar / nav -->
  <app-topbar-v2></app-topbar-v2>

  <div class="layout">
    <app-nav-rail></app-nav-rail>

    <main class="content">

      <!-- Action bar 
      <div class="apfs-actionbar">
        <button type="button" class="btn-create" (click)="createNewForecastRecord()">
          Create New Forecast Record
        </button>
      </div>

       Status cards 
      <app-status-cards [counts]="statusCounts()" (pickStatus)="onPickStatus($event)"></app-status-cards>
-->
      <!-- Workflow health (optional)
      <app-workflow-health></app-workflow-health>
 -->
      <!-- Filters -->
      <!-- <app-dashboard-filters [filters]="filters()" (filtersChange)="onFiltersChange($event)"></app-dashboard-filters> -->

      <!-- Records table -->
      <div class="dashboard-toggle">
        <button [class.active]="currentView() === 'claimed'" (click)="setView('claimed')">
          My Claimed
        </button>

        <button [class.active]="currentView() === 'office'" (click)="setView('office')">
          My Office
        </button>

        <button [class.active]="currentView() === 'activity'" (click)="setView('activity')">
          Recent Activity
        </button>
      </div>
      <app-records-table [rows]="filteredRows()" (rowClick)="openRecord($event)"></app-records-table>


    </main>
  </div>

  <!-- Drawer: ONLY render when we have a record -->
  <app-record-drawer *ngIf="selected() as r" [record]="r" (close)="onCloseDrawer()"
    (recordUpdated)="onRecordUpdated($event)"></app-record-drawer>
</div>
