<div class="table">
  <div class="thead">
    <div>4SITE #</div>
    <div>Title</div>
    <div>Component</div>
    <div>From</div>
    <div>To</div>
    <div>Assigned</div>
    <div>Updated</div>
  </div>

  <div class="tbody">
    <div class="tr row-focus" *ngFor="let r of rows" (click)="rowClick.emit(r)">
      <div>{{ r.apfsNumber || r.id }}</div>
      <div>{{ r.requirement }}</div>
      <div>{{ r.component || '—' }}</div>
      <div>{{ r['worklaneFrom'] }}</div>
      <div>
        {{ r['worklaneTo'] }}
      </div>
      <div>{{ assignedLabel(r) }}</div>
      <div>{{ updatedLabel(r) }}</div>
    </div>

    <div class="empty" *ngIf="!rows?.length">
      No records match your filters.
    </div>
  </div>
</div>
