<!-- Backdrop -->
<div class="backdrop" [class.open]="!!record && !closing" [class.closing]="closing" (click)="requestClose()"></div>

<!-- Drawer -->
<aside class="drawer" [class.open]="!!record && !closing" [class.closing]="closing" (click)="$event.stopPropagation()">

  <div class="head">
    <div class="title">Focus Frame</div>
    <button class="btn" type="button" (click)="requestClose()">✕</button>
  </div>



  <div class="content" *ngIf="record as r">
    <div class="card frame-corner summary">
      <div class="k">4SITE #</div>
      <div class="v mono apfs-id">
        <a class="apfs-link" [routerLink]="['/forecast', r.id]" [queryParams]="{ mode: 'view' }"
          (dblclick)="copyForecastLink(r)">
          {{ r.apfsNumber || r.id }}
        </a>
        <button type="button" class="icon-btn" (click)="copyForecastLink(r); $event.stopPropagation()">
          {{ copiedId === r.id ? '✅' : '🔗' }}
        </button>
        <span class="copy-hint" *ngIf="copiedId === r.id">Copied!</span>
      </div>

      <div class="k">Title</div>
      <div class="v">{{ r.requirementsTitle || '—' }}</div>

      <div class="k">Status</div>
      <div class="v">
        <span class="pill pill--info">{{ r.workflowStatus }}</span>
      </div>

      <div class="k">Assigned</div>
      <div class="v">
        <ng-container *ngIf="r.assignedToUserId; else unclaimed">
          {{ assignedToName }}
        </ng-container>
        <ng-template #unclaimed>—</ng-template>
      </div>
    </div>

    <!-- Actions -->
    <div class="actions" (click)="$event.stopPropagation()">
      <button class="btn btn--primary" type="button" (click)="openRecord()">
        Open Record
      </button>

      <!-- Show when user is allowed to claim (in-lane), even if already assigned -->
      <button *ngIf="canClaim()" type="button" class="btn btn--primary" (click)="onClaim()" [disabled]="isBusy()"
        [title]="isAssignedToMe ? 'Already assigned to you' : ''">
        {{ isBusy() ? 'Claiming…' : (isAssigned ? 'Claim (Take Over)' : 'Claim Record') }}
      </button>

    </div>
  </div>
</aside>
