<!-- Backdrop -->
<div class="backdrop" [class.closing]="closing" (click)="requestClose()"></div>

<!-- Drawer -->
<aside class="drawer" [class.closing]="closing">
  <div class="head">
    <div class="title">Focus Frame</div>
    <button class="btn" type="button" (click)="requestClose()">✕</button>
  </div>

  <div class="content" *ngIf="record as r">
    <div class="card frame-corner summary">
      <div class="k">APFS #</div>
      <div class="v mono">{{ r.apfsNumber || r.id }}</div>

      <div class="k">Title</div>
      <div class="v">{{ r.requirementsTitle || '—' }}</div>

      <div class="k">Status</div>
      <div class="v">
        <span class="pill pill--info">{{ r.status }}</span>
      </div>

      <div class="k">Assigned</div>
      <div class="v">
        <ng-container *ngIf="r.assignedToUserId; else unclaimed">
          {{ assignedToName }}
        </ng-container>
        <ng-template #unclaimed>—</ng-template>
      </div>
    </div>

    <!-- Actions -->
    <div class="actions" (click)="$event.stopPropagation()">
      <button class="btn btn--primary" type="button" (click)="openRecord()">
        Open Record
      </button>

      <!-- Only show when unclaimed -->
      <button *ngIf="!r.assignedToUserId" type="button" class="btn-secondary" (click)="onClaim()" [disabled]="isBusy()">
        {{ isBusy() ? 'Claiming…' : 'Claim Record' }}
      </button>
    </div>
  </div>
</aside>
