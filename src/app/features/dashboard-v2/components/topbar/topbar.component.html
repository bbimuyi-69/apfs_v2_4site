<header class="topbar">
  <div class="brand">
    <img src="/assets/images/4site.jpg" style="width:48px;height:48px;object-fit:cover;" alt="4Site Logo" />

    <div class="brand-text">
      <div class="brand-title">4SITE</div>
      <div class="brand-sub">Dashboard</div>
    </div>
  </div>

  <div class="right">
    <span class="pill pill--info">ENV: {{ env }}</span>
    <span class="pill pill--info">ROLE: {{ roleLabel }}</span>
    <button class="btn btn--primary" type="button" aria-label="Alerts">🔔 Alerts</button>
    <div class="user">{{ displayName }}</div>
  </div>
</header>
