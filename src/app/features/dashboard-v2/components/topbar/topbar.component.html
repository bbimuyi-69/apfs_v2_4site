<header class="topbar">

    <img class="logo" src="/brand/4site.jpg" alt="4SITE" />
    <div class="brand-text">
      <div class="brand-title">APFS</div>
      <div class="brand-sub">4SITE Dashboard</div>
    </div>
  </div>
