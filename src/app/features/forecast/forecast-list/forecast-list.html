<ng-container *ngIf="state$ | async as state">
    <!-- Toolbar -->
    <div class="toolbar">
        <input #search type="text" placeholder="Search APFS or title…" (keyup.enter)="setSearch(search.value)" />
        <button type="button" (click)="setSearch(search.value)">Search</button>

        <select (change)="onStatusChange($event)">
            <option value="All">All statuses</option>
            <option value="Draft">Draft</option>
            <option value="Requirements">Requirements</option>
            <option value="Contracting">Contracting</option>
            <option value="APFS Coordinator">APFS Coordinator</option>
            <option value="Published">Published</option>
        </select>

        <select (change)="onAssignedChange($event)">
            <option value="all">All</option>
            <option value="unclaimed">Unclaimed</option>
            <option value="claimed">Claimed</option>
        </select>

        <button type="button" (click)="refresh()">Refresh</button>
    </div>

    <!-- Loading -->
    <div *ngIf="state.status === 'loading'" class="loading">
        Loading…
    </div>

    <!-- Error -->
    <div *ngIf="state.status === 'error'" class="error">
        {{ state.error }}
        <button type="button" (click)="refresh()">Retry</button>
    </div>

    <!-- Ready -->
    <ng-container *ngIf="state.status === 'ready'">
        <div *ngIf="state.data.length === 0" class="empty">
            No records found.
        </div>

        <div class="record-list">
            <div class="record" *ngFor="let r of state.data" (click)="select(r)" role="button" tabindex="0"
                title="Open record">
                <div class="apfs">{{ r.apfsNumber }}</div>
                <div class="title">{{ r.requirementsTitle }}</div>
                <div class="meta">
                    <span class="pill">{{ r.workflowStatus }}</span>
                    <span class="pill" *ngIf="r.assignedToName">{{ r.assignedToName }}</span>
                    <span class="pill muted" *ngIf="!r.assignedToName">Unclaimed</span>
                </div>
            </div>
        </div>

        <!-- Simple pager (mock + API both support it) -->
        <div class="pager">
            <button type="button" (click)="setPage((query.page ?? 1) - 1)" [disabled]="(query.page ?? 1) <= 1">
                Prev
            </button>

            <div class="page-label">Page {{ query.page ?? 1 }}</div>

            <button type="button" (click)="setPage((query.page ?? 1) + 1)"
                [disabled]="state.data.length < (query.pageSize ?? 25)">
                Next
            </button>
        </div>
    </ng-container>
</ng-container>
